name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests and template examples
        run: npm test

      - name: Benchmark data regenerates byte for byte
        run: |
          node bench/generate.js
          git diff --exit-code -- bench/data

      - name: Benchmark results match the committed table
        run: |
          node bench/run.js
          git diff --exit-code -- bench/RESULTS.md

      - name: Quickstart reports its 4 planted problems (exit 1)
        run: |
          set +e
          node bin/agent-cite-check.js examples/quickstart/report.md --root examples/quickstart/workspace
          code=$?
          test "$code" -eq 1

      - name: File-change demo reports 2 problems (exit 1)
        run: |
          set +e
          node examples/changes/demo.js
          code=$?
          test "$code" -eq 1

      - name: Packed tarball installs and runs
        run: |
          npm pack
          npm install -g ./agent-cite-check-*.tgz
          agent-cite-check --version
